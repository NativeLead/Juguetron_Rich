<script>
    var video = document.getElementById("video");
    var sonido = document.getElementById("sonido");
    var clo = 0;
    var count = 1;
    var count2 = 1;

    sonido.onclick = function() {
        if (count2 % 2 == 0) {
            video.muted = true;
            sonido.classList.remove("unmuted");
            console.log('muted');
        } else {
            video.muted = false;
            sonido.classList.add("unmuted");
            console.log('unmuted');
        }
        count2++;
    }

    function min() {

        var total = Math.trunc(video.duration);
        var porcent = Math.trunc(video.currentTime);
        var porcent25 = Math.trunc(total * 0.25);
        var porcent50 = Math.trunc(total * 0.50);
        var porcent75 = Math.trunc(total * 0.75);
        var porcent100 = Math.trunc(total * 0.999);

        if (porcent == 0 && clo == 0) {
            dhtml.sendEvent(1, 'video_0%');
             // Lanzamiento evento video_0%
            console.log("Se lanza cuartil 0")
            ///////////////////////////////////////
            clo = 1;
            console.log(porcent);
        }
        if (porcent == porcent25 && clo == 1) {
            dhtml.sendEvent(2, 'video_25%');
             // Lanzamiento evento video_25%
            console.log("Se lanza cuartil 25")
            ///////////////////////////////////////
            clo = 2;
            console.log(25);
        } // EJECUCION DE EVENTO CUANDO LLEGUE A 25%
        if (porcent == porcent50 && clo == 2) {
            dhtml.sendEvent(3, 'video_50%');
             // Lanzamiento evento video_50%
            console.log("Se lanza cuartil 50")
            ///////////////////////////////////////
            clo = 3;
            console.log(50);
        }
        if (porcent == porcent75 && clo == 3) {
            dhtml.sendEvent(4, 'video_75%');
             // Lanzamiento evento video_75%
            console.log("Se lanza cuartil 75")
            ///////////////////////////////////////
            clo = 4;
            console.log(75);
        }
        if (porcent == porcent100 && clo == 4) {
            dhtml.sendEvent(5, 'video_100%');
             // Lanzamiento evento video_100%
            console.log("Se lanza cuartil 100")
            ///////////////////////////////////////
            clo = 5;
            console.log(100);
        }
    }

    setInterval('min()', 1000);

    

</script>
