<script>
  const world = document.getElementById('world');
  const body = document.getElementById('body');
  const smoke = document.getElementById('smoke');
  const rod = document.getElementById('rodLine');
  const pinA = document.getElementById('pinA');
  const pinB = document.getElementById('pinB');
  const A = {x:657, y:1575, r:42}, B = {x:1243, y:1527, r:32};
  const trip = 9;          // segundos para cruzar la pantalla
  const startX = -2000, endX = 6000;
  const speed = (endX - startX) / trip;
  const turn = (2 * Math.PI * 237) / speed;
  // humo: se balancea, se estira hacia atrás y se infla desde la chimenea
  function smokeTransform(s, th){
    const k = (1 - Math.cos(2 * th)) / 2;               // bocanadas al ritmo de las ruedas
    const sway = Math.sin(2 * Math.PI * s / 1.8) * 1.6;  // balanceo lento (grados)
    const sx = 1 + 0.035 * k + 0.015 * Math.sin(2 * Math.PI * s / 1.3);
    const sy = 1 + 0.03 * k - 0.012 * Math.sin(2 * Math.PI * s / 1.3);
    const skew = 2 + 2 * Math.sin(2 * Math.PI * s / 2.2); // se arrastra hacia atrás
    return `translate(1375,815) rotate(${sway}) skewX(${skew}) scale(${sx},${sy}) translate(-1375,-815)`;
  }
  function frame(t){
    const s = t / 1000;
    const x = startX + ((s % trip) / trip) * (endX - startX);
    world.setAttribute('transform', `translate(${x},0)`);
    const th = -s * Math.PI * 2 / turn;
    const ax = A.x + A.r*Math.cos(th), ay = A.y + A.r*Math.sin(th);
    const bx = B.x + B.r*Math.cos(th), by = B.y + B.r*Math.sin(th);
    rod.setAttribute('x1', ax); rod.setAttribute('y1', ay);
    rod.setAttribute('x2', bx); rod.setAttribute('y2', by);
    pinA.setAttribute('transform', `translate(${ax},${ay})`);
    pinB.setAttribute('transform', `translate(${bx},${by})`);
    const bob = Math.abs(Math.sin(th)) * 12;
    const rock = Math.sin(th) * 0.8;
    body.setAttribute('transform', `translate(0,${-bob}) rotate(${rock} 900 1500)`);
    // humo: se infla y desinfla desde la chimenea (dos bocanadas por vuelta de rueda)
    smoke.setAttribute('transform', smokeTransform(s, th));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
